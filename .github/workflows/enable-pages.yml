name: enable-pages
on:
  push:
    paths:
      - ".github/workflows/enable-pages.yml"
  workflow_dispatch:
permissions:
  pages: write
  contents: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/pages >/tmp/pages.json 2>/dev/null; then
            echo "pages already exists"
            cat /tmp/pages.json
          else
            echo "creating pages site (main, /)"
            gh api --method POST repos/${{ github.repository }}/pages \
              -H "Accept: application/vnd.github+json" \
              -f "build_type=legacy" \
              -f "source[branch]=main" \
              -f "source[path]=/" || { echo "POST_FAILED"; gh api repos/${{ github.repository }}/pages || true; exit 1; }
            gh api repos/${{ github.repository }}/pages
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove this temporary workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/enable-pages.yml || true
          if git diff --cached --quiet; then
            echo "nothing to remove"
            exit 0
          fi
          git commit -m "chore: quitar flujo temporal de GitHub Pages"
          git push origin main
