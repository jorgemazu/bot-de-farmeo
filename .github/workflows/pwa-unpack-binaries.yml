name: pwa-unpack-binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".binaries.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack icons and maps
        run: |
          set -euo pipefail
          test -f .binaries.b64
          python3 - <<'PY'
          import base64, io, tarfile
          from pathlib import Path
          data = base64.b64decode(Path(".binaries.b64").read_bytes())
          tf = tarfile.open(fileobj=io.BytesIO(data), mode="r:gz")
          tf.extractall(".")
          print("extracted", len(tf.getnames()), "files")
          PY
          rm -f .binaries.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # do not keep the workflow after unpack
          git rm -f --ignore-unmatch .github/workflows/pwa-unpack-binaries.yml || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "PWA 1.0.18-pwa: iconos y mapas"
          git push origin main
